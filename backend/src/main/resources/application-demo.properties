# Perfil "demo": acrescenta os dados de demonstração usados na apresentação (db/demo).
# Uso: mvnw spring-boot:run -Dspring-boot.run.profiles=h2,demo
# A pasta do esquema vem de app.flyway.esquema, para o perfil funcionar com MySQL, H2 e PostgreSQL (nuvem).
spring.flyway.locations=${app.flyway.esquema},classpath:db/demo
