# Perfil "h2": banco em memória em modo de compatibilidade MySQL.
# Útil para rodar o projeto sem instalar o MySQL (os dados são perdidos ao encerrar a aplicação).
# Uso: mvnw spring-boot:run -Dspring-boot.run.profiles=h2
spring.datasource.url=jdbc:h2:mem:moeda_estudantil;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# Console web do H2 em http://localhost:8080/h2-console (JDBC URL acima, usuário sa, sem senha)
spring.h2.console.enabled=true
