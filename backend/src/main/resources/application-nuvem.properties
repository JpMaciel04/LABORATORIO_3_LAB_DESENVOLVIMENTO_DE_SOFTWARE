# Perfil "nuvem": implantação no Render (Lab04S02 - docs/sprint-05/diagrama-implantacao.puml).
# Uso: SPRING_PROFILES_ACTIVE=nuvem,demo (definido no render.yaml).

# --- Banco de dados: PostgreSQL gerenciado do Render ---
# As variáveis DB_* são preenchidas pelo render.yaml a partir do banco criado no Blueprint.
# DB_URL substitui todas elas, para usar outro PostgreSQL (ex.: jdbc:postgresql://host:5432/banco?sslmode=require).
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:moeda_estudantil}}
spring.datasource.username=${DB_USERNAME:moeda_estudantil}
spring.datasource.password=${DB_PASSWORD:}
# Poucas conexões: a instância gratuita tem 512 MB de memória e atende poucos usuários ao mesmo tempo.
spring.datasource.hikari.maximum-pool-size=5

# Mesmo esquema de db/migration, escrito no dialeto do PostgreSQL.
app.flyway.esquema=classpath:db/postgresql

# --- Proxy do Render ---
# O HTTPS termina no balanceador do Render, que repassa a requisição com os cabeçalhos X-Forwarded-*;
# assim, as URLs geradas pela API (cabeçalho Location) usam https e o domínio público.
server.forward-headers-strategy=framework

# --- Servidor ---
# Poucas threads: a instância gratuita tem 0,1 CPU; requisições além disso aguardam na fila.
server.tomcat.threads.max=20
