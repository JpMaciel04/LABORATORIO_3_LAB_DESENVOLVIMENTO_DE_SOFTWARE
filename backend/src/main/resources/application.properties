spring.application.name=moeda-estudantil
server.port=${PORT:8080}

# --- Banco de dados: MySQL 8 ---
# Credenciais lidas de variáveis de ambiente; o banco é criado automaticamente se não existir.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/moeda_estudantil?createDatabaseIfNotExist=true&serverTimezone=America/Sao_Paulo}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

# --- ORM (JPA/Hibernate) ---
# O esquema é criado e versionado pelo Flyway (db/migration); o Hibernate apenas valida
# se as entidades estão alinhadas com as tabelas e falha na inicialização se houver divergência.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
# Associações carregadas em lote em vez de uma consulta por registro (problema N+1).
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# --- Migrações ---
# Pasta com o esquema e a carga inicial. O perfil "nuvem" a troca pela versão PostgreSQL (db/postgresql)
# e o perfil "demo" acrescenta os dados de demonstração, por isso a pasta fica em uma propriedade própria.
spring.flyway.enabled=true
app.flyway.esquema=classpath:db/migration
spring.flyway.locations=${app.flyway.esquema}

# --- API ---
# RN05 e RN09: quantidades e custos são inteiros; 10.5 é recusado em vez de ser truncado para 10.
spring.jackson.deserialization.accept-float-as-int=false

# --- Front-end autorizado a consumir a API (CORS) ---
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

# --- Autenticação (JWT) ---
# Sem JWT_SECRET (mínimo de 32 caracteres), uma chave aleatória é gerada a cada inicialização.
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiracao-minutos=${JWT_EXPIRACAO_MINUTOS:120}

# --- Fotos das vantagens ---
# Gravadas no banco (tabela foto), e não em disco: na nuvem, o disco do servidor é apagado a cada reinício.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
# Lê o restante de um upload grande demais, para que o navegador receba a mensagem de erro da API.
server.tomcat.max-swallow-size=-1

# --- Crédito semestral (RN04) ---
# Verificação diária às 00:05: o crédito só ocorre uma vez por semestre.
app.credito-semestral.cron=${CREDITO_SEMESTRAL_CRON:0 5 0 * * *}
app.credito-semestral.ao-iniciar=true

# --- E-mail (RN07, RN11) ---
# Defina SPRING_MAIL_HOST (e SPRING_MAIL_PORT, SPRING_MAIL_USERNAME, SPRING_MAIL_PASSWORD) para enviar por SMTP.
# Sem servidor configurado, os e-mails são escritos no log da aplicação.
app.email.remetente=${MAIL_FROM:nao-responda@moedaestudantil.pucminas.br}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
